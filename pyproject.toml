[project]
name = "cityscapes-segmentation"
version = "0.1.0"
description = "DeepLabV3+ built from scratch (Xception encoder, ASPP, decoder) for Cityscapes semantic segmentation."
readme = "README.md"
requires-python = ">=3.10"
# Read from the notebook's actual imports. Versions are those installed in the development
# environment; the last four are not installed locally, so they are left unpinned.
# google.colab is not listed: it is provided by the Colab runtime, not installable from PyPI.
dependencies = [
    "torch==2.9.0",
    "numpy==1.26.4",
    "opencv-python==4.12.0.88",
    "matplotlib==3.10.7",
    "tqdm==4.67.1",
    "albumentations",
    "timm",
    "grad-cam",
    "cityscapesscripts",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# CitySegmentation.ipynb is an analysis artifact, not a lint target — Ruff never
# touches it. Only .py scripts (future tooling, tests, etc.) are linted.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
